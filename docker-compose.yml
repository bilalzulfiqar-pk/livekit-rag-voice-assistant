services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: livekit_rag_postgres
    restart: unless-stopped
    env_file:
      - ./services/rag-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-backend:
    build:
      context: ./services/rag-backend
    container_name: livekit_rag_backend
    restart: unless-stopped
    env_file:
      - ./services/rag-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
