services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: livekit_rag_postgres
    restart: unless-stopped
    env_file:
      - ./services/rag-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-backend:
    build:
      context: ./services/rag-backend
    container_name: livekit_rag_backend
    restart: unless-stopped
    env_file:
      - ./services/rag-backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend_cache:/code/.cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ./apps/agent
    container_name: livekit_rag_agent
    restart: unless-stopped
    env_file:
      - ./apps/agent/.env
    environment:
      RAG_BACKEND_URL: http://rag-backend:8000
      RAG_CONTEXT_PATH: /retrieval/context
      RAG_CHAT_PATH: /chat/ask
    volumes:
      - agent_cache:/root/.cache
    depends_on:
      rag-backend:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: livekit_rag_web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      rag-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_cache:
  agent_cache:
